<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord - Pilotage Auchan</title>
    
    <!-- L'icône de l'onglet -->
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAABmJLR0QA/wD/AP+gvaeTAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUH5wEJEQ8qI9z6WQAAAB1pVFh0Q29tbWVudAAAAAAAQ3JlYXRlZCB3aXRoIEdJTVBkLTeTAAAAtElEQVRYhe2WMQrCQBBF38YUEiy0sRGsbLyAjbWX8AI2XsDCK9h4AQuvYOMFbLyAhVew8QoWXsHGC1h4BQsrQRIsQmST3SQQxML3YGF2ZnZ2ZnZ2Bv4FInoDmkANqAIloABkAQGcgBPQBtrAA3gCT+AFvIE38AG+wA/4AQEIAgEYAgEYAQEYAwGYAA5gCjiBGeACZkAA5kAIrIAVsAbWwAbYAjvgAOyBI3ACzsAFuAJ34AFUfuUAvgInG6Z9E90AAAAASUVORK5CYII=">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --idle-color: #10b981;
            --busy-color: #ef4444;
            --pause-color: #f59e0b; /* Orange pour les pauses */
            --mail-color: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            padding: 30px 20px;
            line-height: 1.5;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
        .header p { color: var(--text-muted); font-size: 15px; }

        .paste-section {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .paste-section p { font-size: 14px; color: var(--text-muted); margin-bottom: 15px; }

        textarea { 
            width: 100%; height: 150px; padding: 15px; 
            border: 2px solid var(--border-color); border-radius: 8px; 
            font-family: 'Courier New', monospace; font-size: 13px; resize: vertical;
            transition: border-color 0.2s; margin-bottom: 15px;
        }
        textarea:focus { outline: none; border-color: var(--primary); }

        .btn-group { display: flex; gap: 12px; }

        button { 
            background-color: var(--primary); color: white; border: none; 
            padding: 12px 24px; cursor: pointer; border-radius: 8px; 
            font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif;
            transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        button.reset { background-color: #f1f5f9; color: #475569; }
        button.reset:hover { background-color: #e2e8f0; color: #1e293b; }

        /* Cartes de statut (Idle / Busy / Pause) */
        .states { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* S'adapte pour 3 blocs */
            gap: 20px; 
            margin-bottom: 30px; 
        }
        .state-box { 
            background: var(--card-bg); padding: 25px; border-radius: 12px; 
            text-align: center; border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .state-box h4 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 10px; }
        .state-box .val { font-size: 42px; font-weight: 700; }
        .val.idle { color: var(--idle-color); }
        .val.busy { color: var(--busy-color); }
        .val.pause { color: var(--pause-color); }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { 
            background: var(--card-bg); padding: 25px 20px; border-radius: 12px; text-align: center; 
            border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-3px); }
        .card.mail { border-top-color: var(--mail-color); }
        .card h3 { font-size: 14px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        .card .value { font-size: 38px; font-weight: 700; color: var(--primary); }
        .card.mail .value { color: var(--mail-color); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Tableau de Bord - Pilotage Auchan</h1>
        <p>Outil d'analyse des compétences en temps réel</p>
    </div>

    <div class="paste-section">
        <p><strong>Instructions :</strong> <br> 1. Copiez les données depuis votre outil de supervision (Ctrl+A, Ctrl+C). <br> 2. Collez-les ci-dessous et lancez l'analyse.</p>
        <textarea id="pasteZone" placeholder="Collez les données de supervision ici..."></textarea>
        
        <div class="btn-group">
            <button onclick="analyserDonnees()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                Analyser les données
            </button>
            <button class="reset" onclick="resetData()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                Effacer
            </button>
        </div>
    </div>

    <!-- Section Etats -->
    <div class="states hidden" id="statesContainer">
        <div class="state-box">
            <h4>Agents Idle (Prêt)</h4>
            <div class="val idle" id="countIdle">0</div>
        </div>
        <div class="state-box">
            <h4>Agents Busy + Wrap Up</h4>
            <div class="val busy" id="countBusy">0</div>
        </div>
        <!-- NOUVELLE CARTE PAUSE -->
        <div class="state-box">
            <h4>Agents en Pause</h4>
            <div class="val pause" id="countPause">0</div>
        </div>
    </div>

    <div class="dashboard hidden" id="dashboardContainer"></div>
</div>

<script>
    const REGLES_SKILLS = {
        'HYPER': /\b(A2PAS|AUCHAN\s*GO|FNR|HYPER|MYAUCHAN|QUALITE|SUPER|THYPER|TSUPER|UPROXY)\b/i,
        'AFR': /\b(AFR|TAUCHAN\s*FR)\b/i,
        'DRIVE': /(?<!Auchan\s)\b(DRIVE|TDRIVE)\b/i,
        'SAV': /\b(RED\s*SAV|SAV|SAVED|TSAV)\b/i,
        'BARCELONE': /\b(BARCELONE)\b/i 
    };

    function analyserDonnees() {
        const texte = document.getElementById('pasteZone').value;
        if (!texte.trim()) { alert("Veuillez coller des données d'abord."); return; }

        const agents = texte.split(/WEB_/i);
        let stats = { 'HYPER': 0, 'AFR': 0, 'DRIVE': 0, 'SAV': 0, 'BARCELONE': 0, 'MAIL (C Case)': 0 };
        let idle = 0; 
        let busy = 0;
        let pause = 0; // Nouveau compteur

        for (let i = 1; i < agents.length; i++) {
            let blocAgent = agents[i];
            let texteNettoye = blocAgent.replace(/C\s+(?!Case)[^\n]*/gi, '').replace(/\n/g, ' ');

            const estIdle = /\bIdle\b/i.test(texteNettoye);
            const estBusy = /\bBusy\b/i.test(texteNettoye);
            const estWrapUp = /\bWrap\s*Up\b/i.test(texteNettoye) || /\bWrapUp\b/i.test(texteNettoye);
            
            // Détection des pauses (Pause, Pause cafe, Pause dej, etc.)
            const estPause = /\bPause\b/i.test(texteNettoye); 

            // Comptage des statuts
            if (estIdle) {
                idle++;
            } else if (estBusy || estWrapUp) {
                busy++;
            } else if (estPause) {
                pause++;
            } else {
                // Connexion, Brief, etc. : on ne les compte pas dans les 3 cartes
            }

            // RÈGLE STRICTE : On ne compte les skills QUE si l'agent est Idle, Busy ou WrapUp
            if (!estIdle && !estBusy && !estWrapUp) {
                continue; // Si en pause ou autre, on ignore ses compétences
            }

            for (const [categorie, regex] of Object.entries(REGLES_SKILLS)) {
                if (regex.test(texteNettoye)) stats[categorie]++;
            }
            if (/\bC\s*Case\b/i.test(texteNettoye)) stats['MAIL (C Case)']++;
        }

        // Affichage des statuts
        document.getElementById('statesContainer').classList.remove('hidden');
        document.getElementById('countIdle').innerText = idle;
        document.getElementById('countBusy').innerText = busy;
        document.getElementById('countPause').innerText = pause; // Affichage des pauses

        // Affichage des skills
        const dashboard = document.getElementById('dashboardContainer');
        dashboard.innerHTML = ''; 
        dashboard.classList.remove('hidden');

        for (const [titre, count] of Object.entries(stats)) {
            const card = document.createElement('div');
            card.className = titre.includes('MAIL') ? 'card mail' : 'card';
            card.innerHTML = `<h3>${titre}</h3><div class="value">${count}</div>`;
            dashboard.appendChild(card);
        }
    }

    function resetData() {
        document.getElementById('pasteZone').value = '';
        document.getElementById('statesContainer').classList.add('hidden');
        document.getElementById('dashboardContainer').classList.add('hidden');
        document.getElementById('dashboardContainer').innerHTML = '';
    }
</script>

</body>
</html>
